name: Release on tag

# Auto-triggers when a version tag (e.g. v0.5.0) is pushed. Builds the
# "Payload Manager X" replacement binary (port 8084), names it
# pldmgrx_<tag>.elf (e.g. pldmgrx_v0.5.0.elf), and publishes a GitHub Release
# with that ELF attached.
#
# Cut a release with:
#   git tag v0.5.0 && git push origin v0.5.0

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: make frontend-build

      - name: Build PS5 SDK Docker image
        run: docker build -t ps5-payload-sdk -f Dockerfile.sdk .

      - name: Build Payload Manager X (port 8084)
        run: docker run --rm -v "$(pwd)":/src -w /src ps5-payload-sdk make clean all PLDMGRX=1 PLDMGRX_PORT=8084

      - name: Name the release ELF
        run: mv pldmgrx_8084.elf "pldmgrx_${{ github.ref_name }}.elf"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Payload Manager X ${{ github.ref_name }}" \
            --generate-notes \
            "pldmgrx_${{ github.ref_name }}.elf"
